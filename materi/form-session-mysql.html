          { id: 1, tugas: "Install Laragon & VS Code", status: "Selesai" },

        const quizQuestions = [
          {

              "POST mengirim data di dalam body HTTP Request sehingga tidak terlihat di URL dan mendukung pengiriman data besar atau sensitif.",
          },
          {
            q: "2. Fungsi PHP apa yang wajib dipanggil di baris paling atas sebelum menggunakan $_SESSION?",

              "session_begin();",
              "start_login();",
              "session_start();",
              "mysqli_connect();",
            ],
            correct: 2,

              "session_start() wajib dipanggil di awal skrip PHP sebelum ada output HTML agar server bisa membaca atau menyimpan data $_SESSION.",
          },
          {
            q: "3. Apa fungsi utama Primary Key (misalnya kolom id) pada sebuah tabel MySQL?",

              "Mengubah warna tampilan tabel di HTML",
              "Menjadi identitas unik pembeda setiap baris data agar tidak tertukar saat update/delete",
              "Menghapus seluruh isi database secara otomatis",
              "Menyimpan password pengguna dalam bentuk teks biasa",

          },
          {
            q: '4. Perintah SQL manakah yang benar untuk mengubah status tugas menjadi "Selesai" pada id = 3?',

              'INSERT INTO catatan (status) VALUES ("Selesai") WHERE id = 3;',
              'UPDATE catatan SET status = "Selesai" WHERE id = 3;',
              "DELETE FROM catatan WHERE id = 3;",

            correct: 2,
            explain:
              "UPDATE ... SET ... WHERE ... digunakan untuk memperbarui data yang sudah ada. Klausa WHERE wajib ada agar tidak semua baris ikut berubah!",
          },
        ];

        const slides = [
          {
            title: "Sampul & Tujuan Belajar Pertemuan 2",

            .replace(/</g, "&lt;")

        }

        // 1. Sampul

          return `
          <div class="space-y-8">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 text-xs font-semibold">
              <span>PERTEMUAN 2 • PERSIAPAN UKK RPL / PPLG</span>
            </div>

            <div class="space-y-4">
              <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-white leading-tight">
                Form Handling, Session, &amp;<br />
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-indigo-400 to-emerald-300">Basis Data MySQL Dasar</span>

              </p>

            </div>
          </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

              <div class="p-6 rounded-2xl bg-indigo-950/50 border-l-4 border-indigo-400 space-y-2">
                <p class="text-xs font-bold uppercase text-indigo-300">Solusi Pertemuan 2</p>
                <h3 class="text-xl font-bold text-white">Form + Session + DB</h3>

              </div>
            </div>
          </div>
        `;
        }

            <div>
              <p class="text-xs font-bold uppercase tracking-widest text-cyan-400">Komunikasi Browser → Server</p>

                <pre class="text-sm text-cyan-200 overflow-x-auto leading-relaxed mt-2"><code>${escapeHtml('<form action="proses.php" method="POST">\n  <input type="text" name="nama_siswa">\n  <input type="number" name="nilai">\n  <button type="submit">Simpan</button>\n</form>')}</code></pre>

              <div class="space-y-4">

                  <p class="text-sm font-bold text-cyan-300">1. action="proses.php"</p>

                </div>
                <div class="p-4 rounded-xl bg-slate-900/80 border border-slate-800">

                  <p class="text-sm text-slate-300 mt-1">Cara pengiriman paket data ke server (lewat URL atau lewat body request).</p>

              </div>

        `;
        }

          <div class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                <p class="text-xs font-bold uppercase tracking-widest text-cyan-400">Simulasi Interaktif</p>
                <h2 class="text-3xl sm:text-4xl font-bold text-white mt-1"><code class="text-indigo-400">$_GET</code> vs <code class="text-emerald-400">$_POST</code></h2>
              </div>

              </div>

              <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-5 space-y-4">

                      (r) => `
                    <tr>
                      <td class="px-4 py-2.5 font-mono text-slate-500">${r.id}</td>
                      <td class="px-4 py-2.5 font-semibold">${escapeHtml(r.tugas)}</td>
                      <td class="px-4 py-2.5">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${r.status === "Selesai" ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-800"}">${r.status}</span>
                      </td>
                      <td class="px-4 py-2.5 text-right space-x-1.5">
                        <button type="button" data-todo-toggle="${r.id}" class="px-2.5 py-1 rounded bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs font-semibold transition">Ubah Status</button>
                        <button type="button" data-todo-del="${r.id}" class="px-2.5 py-1 rounded bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-semibold transition">Hapus</button>
                      </td>
                    </tr>
                  `,
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
        }

        // 16. Kuis Pemahaman
        function renderSlide16() {
          const answeredCount = Object.keys(quizAnswers).length;
          let correctCount = 0;
          quizQuestions.forEach((q, i) => {
            if (quizAnswers[i] === q.correct) correctCount++;
          });

          return `
          <div class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <p class="text-xs font-bold uppercase tracking-widest text-cyan-400">Evaluasi &amp; Refleksi</p>
                <h2 class="text-3xl font-bold text-white mt-1">Kuis Cepat Pertemuan 2</h2>
              </div>
              <div class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-sm font-semibold text-indigo-300">
                Skor: ${correctCount} / ${quizQuestions.length} (${answeredCount} terjawab)
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${quizQuestions
                .map((item, qIdx) => {
                  const chosen = quizAnswers[qIdx];
                  const isAnswered = chosen !== undefined;
                  return `
                  <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-2.5">
                    <p class="text-sm font-semibold text-white">${item.q}</p>
                    <div class="space-y-1.5">
                      ${item.options
                        .map((opt, oIdx) => {
                          let btnStyle =
                            "bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-800";
                          if (isAnswered) {
                            if (oIdx === item.correct) {
                              btnStyle =
                                "bg-emerald-600/25 border-emerald-400 text-emerald-200 font-semibold";
                            } else if (oIdx === chosen) {
                              btnStyle =
                                "bg-rose-600/25 border-rose-400 text-rose-200";
                            } else {
                              btnStyle =
                                "bg-slate-950 border-slate-800 text-slate-500 opacity-50";
                            }
                          }
                          return `
                          <button type="button" data-quiz-q="${qIdx}" data-quiz-o="${oIdx}" class="w-full text-left text-xs p-2.5 rounded-lg border transition ${btnStyle}">
                            ${escapeHtml(opt)}
                          </button>
                        `;
                        })
                        .join("")}
                    </div>
                    ${isAnswered ? `<p class="text-xs ${chosen === item.correct ? "text-emerald-300" : "text-amber-300"} pt-1">💡 ${item.explain}</p>` : ""}
                  </div>
                `;
                })
                .join("")}
            </div>
          </div>
        `;
        }

        function render() {
          const container = document.getElementById("slide-container");
          const counter = document.getElementById("slide-counter");
          const progress = document.getElementById("progress-bar");
          const selector = document.getElementById("slide-selector");
          const footerTitle = document.getElementById("footer-slide-title");
          const btnPrev = document.getElementById("btn-prev");
          const btnNext = document.getElementById("btn-next");

          container.classList.remove("slide-enter");
          void container.offsetWidth;
          container.classList.add("slide-enter");

          container.innerHTML = slides[currentSlide].render();
          footerTitle.textContent = slides[currentSlide].title;
          counter.textContent = `${currentSlide + 1} / ${slides.length}`;
          progress.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
          selector.value = String(currentSlide);

          btnPrev.disabled = currentSlide === 0;
          btnNext.disabled = currentSlide === slides.length - 1;

          attachDynamicListeners();
        }

        function attachDynamicListeners() {
          const container = document.getElementById("slide-container");

          container.querySelectorAll("[data-method]").forEach((btn) => {
            btn.addEventListener("click", () => {
              formMethod = btn.getAttribute("data-method");
              render();
            });
          });

          const simNama = container.querySelector("#sim-nama");
          if (simNama) {
            simNama.addEventListener("input", (e) => {
              formInputNama = e.target.value;
              render();
              const el = document.getElementById("sim-nama");
              if (el) {
                el.focus();
                el.setSelectionRange(el.value.length, el.value.length);
              }
            });
          }

          const simNilai = container.querySelector("#sim-nilai");
          if (simNilai) {
            simNilai.addEventListener("input", (e) => {
              formInputNilai = e.target.value;
              render();
              const el = document.getElementById("sim-nilai");
              if (el) {
                el.focus();
                el.setSelectionRange(el.value.length, el.value.length);
              }
            });
          }

          const toggleSessionBtn = container.querySelector(
            "#btn-toggle-session",
          );
          if (toggleSessionBtn) {
            toggleSessionBtn.addEventListener("click", () => {
              sessionLoggedIn = !sessionLoggedIn;
              render();
            });
          }

          container.querySelectorAll("[data-sql]").forEach((btn) => {
            btn.addEventListener("click", () => {
              sqlFilter = btn.getAttribute("data-sql");
              render();
            });
          });

          const todoForm = container.querySelector("#todo-form");
          if (todoForm) {
            todoForm.addEventListener("submit", (e) => {
              e.preventDefault();
              const val = document.getElementById("todo-input").value.trim();
              if (val) {
                todoRows.push({
                  id: nextTodoId++,
                  tugas: val,
                  status: "Belum",
                });
                lastSqlQuery = `INSERT INTO catatan (tugas, status) VALUES ('${val}', 'Belum');`;
                render();
              }
            });
          }

          container.querySelectorAll("[data-todo-toggle]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = parseInt(btn.getAttribute("data-todo-toggle"), 10);
              const item = todoRows.find((r) => r.id === id);
              if (item) {
                item.status = item.status === "Selesai" ? "Belum" : "Selesai";
                lastSqlQuery = `UPDATE catatan SET status = '${item.status}' WHERE id = ${id};`;
                render();
              }
            });
          });

          container.querySelectorAll("[data-todo-del]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = parseInt(btn.getAttribute("data-todo-del"), 10);
              todoRows = todoRows.filter((r) => r.id !== id);
              lastSqlQuery = `DELETE FROM catatan WHERE id = ${id};`;
              render();
            });
          });

          container.querySelectorAll("[data-quiz-q]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const q = parseInt(btn.getAttribute("data-quiz-q"), 10);
              const o = parseInt(btn.getAttribute("data-quiz-o"), 10);
              quizAnswers[q] = o;
              render();
            });
          });
        }

        // Initialize selector & navigation
        const selector = document.getElementById("slide-selector");
        slides.forEach((s, idx) => {
          const opt = document.createElement("option");
          opt.value = String(idx);
          opt.textContent = `${idx + 1}. ${s.title}`;
          opt.className = "bg-slate-900 text-slate-100";
          selector.appendChild(opt);
        });

        selector.addEventListener("change", (e) => {
          currentSlide = parseInt(e.target.value, 10) || 0;
          render();
        });

        document.getElementById("btn-prev").addEventListener("click", () => {
          if (currentSlide > 0) {
            currentSlide--;
            render();
          }
        });

        document.getElementById("btn-next").addEventListener("click", () => {
          if (currentSlide < slides.length - 1) {
            currentSlide++;
            render();
          }
        });

        function toggleFullscreen() {
          try {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen();
            } else {
              document.exitFullscreen();
            }
          } catch (err) {
            // Ignore if sandbox iframe restricts fullscreen
          }
        }

        document
          .getElementById("btn-fullscreen")
          .addEventListener("click", toggleFullscreen);

        document.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")
            return;
          if (e.key === "ArrowRight" && currentSlide < slides.length - 1) {
            currentSlide++;
            render();
          } else if (e.key === "ArrowLeft" && currentSlide > 0) {
            currentSlide--;
            render();
          } else if (e.key === "f" || e.key === "F") {
            toggleFullscreen();
          }
        });

        render();
      })();
    </script>
  </body>
</html>
