              <input id="mp-kelas" type="text" value="XII RPL 1" required class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <input id="mp-nilai" type="number" min="0" max="100" placeholder="Nilai (0-100)" required class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg px-4 py-2 text-sm transition">+ Tambah ke Array</button>
            </form>

            <div class="overflow-x-auto bg-white rounded-xl text-slate-900 shadow">
              <table class="w-full text-left text-sm border-collapse">
                <thead class="bg-slate-100 border-b border-slate-200 text-slate-700">
                  <tr>
                    <th class="px-4 py-2.5">No</th>
                    <th class="px-4 py-2.5">Nama Siswa</th>
                    <th class="px-4 py-2.5">Kelas</th>
                    <th class="px-4 py-2.5">Nilai</th>
                    <th class="px-4 py-2.5">Status (if/else)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                  ${miniProjectStudents.map((s, idx) => {
                    const lulus = s.nilai >= 75;
                    return `
                      <tr>
                        <td class="px-4 py-2.5 font-mono text-slate-500">${idx + 1}</td>
                        <td class="px-4 py-2.5 font-semibold">${escapeHtml(s.nama)}</td>
                        <td class="px-4 py-2.5">${escapeHtml(s.kelas)}</td>
                        <td class="px-4 py-2.5 font-mono font-bold">${s.nilai}</td>
                        <td class="px-4 py-2.5">
                          <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${lulus ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                            ${lulus ? 'Kompeten' : 'Remedial'}
                          </span>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // 16. Refleksi & Kuis Pemahaman
      function renderSlide16() {
        const answeredCount = Object.keys(quizAnswers).length;
        let correctCount = 0;
        quizQuestions.forEach((q, i) => {
          if (quizAnswers[i] === q.correct) correctCount++;
        });

        return `
          <div class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <p class="text-xs font-bold uppercase tracking-widest text-cyan-400">Evaluasi &amp; Refleksi</p>
                <h2 class="text-3xl font-bold text-white mt-1">Kuis Cepat Minggu 1</h2>
              </div>
              <div class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-sm font-semibold text-indigo-300">
                Skor: ${correctCount} / ${quizQuestions.length} (${answeredCount} terjawab)
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${quizQuestions.map((item, qIdx) => {
                const chosen = quizAnswers[qIdx];
                const isAnswered = chosen !== undefined;
                return `
                  <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-2.5">
                    <p class="text-sm font-semibold text-white">${item.q}</p>
                    <div class="space-y-1.5">
                      ${item.options.map((opt, oIdx) => {
                        let btnStyle = 'bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-800';
                        if (isAnswered) {
                          if (oIdx === item.correct) {
                            btnStyle = 'bg-emerald-600/25 border-emerald-400 text-emerald-200 font-semibold';
                          } else if (oIdx === chosen) {
                            btnStyle = 'bg-rose-600/25 border-rose-400 text-rose-200';
                          } else {
                            btnStyle = 'bg-slate-950 border-slate-800 text-slate-500 opacity-50';
                          }
                        }
                        return `
                          <button type="button" data-quiz-q="${qIdx}" data-quiz-o="${oIdx}" class="w-full text-left text-xs p-2.5 rounded-lg border transition ${btnStyle}">
                            ${escapeHtml(opt)}
                          </button>
                        `;
                      }).join('')}
                    </div>
                    ${isAnswered ? `<p class="text-xs ${chosen === item.correct ? 'text-emerald-300' : 'text-amber-300'} pt-1">💡 ${item.explain}</p>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      function render() {
        const container = document.getElementById('slide-container');
        const counter = document.getElementById('slide-counter');
        const progress = document.getElementById('progress-bar');
        const selector = document.getElementById('slide-selector');
        const footerTitle = document.getElementById('footer-slide-title');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        container.classList.remove('slide-enter');
        void container.offsetWidth;
        container.classList.add('slide-enter');

        container.innerHTML = slides[currentSlide].render();
        footerTitle.textContent = slides[currentSlide].title;
        counter.textContent = `${currentSlide + 1} / ${slides.length}`;
        progress.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
        selector.value = String(currentSlide);

        btnPrev.disabled = currentSlide === 0;
        btnNext.disabled = currentSlide === slides.length - 1;

        attachDynamicListeners();
      }

      function attachDynamicListeners() {
        const container = document.getElementById('slide-container');

        container.querySelectorAll('[data-compare]').forEach(btn => {
          btn.addEventListener('click', () => {
            compareMode = btn.getAttribute('data-compare');
            render();
          });
        });

        const httpBtn = container.querySelector('#btn-http-step');
        if (httpBtn) {
          httpBtn.addEventListener('click', () => {
            httpStep = httpStep < 4 ? httpStep + 1 : 0;
            render();
          });
        }

        container.querySelectorAll('[data-tool]').forEach(btn => {
          btn.addEventListener('click', () => {
            setupTool = btn.getAttribute('data-tool');
            render();
          });
        });

        container.querySelectorAll('[data-preset]').forEach(btn => {
          btn.addEventListener('click', () => {
            phpPreset = btn.getAttribute('data-preset');
            render();
          });
        });

        const nilaiSlider = container.querySelector('#nilai-slider');
        if (nilaiSlider) {
          nilaiSlider.addEventListener('input', (e) => {
            simNilai = parseInt(e.target.value, 10) || 0;
            render();
            const newSlider = document.getElementById('nilai-slider');
            if (newSlider) newSlider.focus();
          });
        }

        container.querySelectorAll('[data-loop]').forEach(btn => {
          btn.addEventListener('click', () => {
            loopMode = btn.getAttribute('data-loop');
            loopCount = 0;
            render();
          });
        });

        const loopStepBtn = container.querySelector('#btn-loop-step');
        if (loopStepBtn) {
          loopStepBtn.addEventListener('click', () => {
            loopCount = loopCount < 5 ? loopCount + 1 : 0;
            render();
          });
        }

        const loopAllBtn = container.querySelector('#btn-loop-all');
        if (loopAllBtn) {
          loopAllBtn.addEventListener('click', () => {
            loopCount = 5;
            render();
          });
        }

        container.querySelectorAll('[data-array-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedArrayKey = parseInt(btn.getAttribute('data-array-idx'), 10);
            render();
          });
        });

        const mpForm = container.querySelector('#mini-project-form');
        if (mpForm) {
          mpForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nama = document.getElementById('mp-nama').value.trim();
            const kelas = document.getElementById('mp-kelas').value.trim();
            const nilai = parseInt(document.getElementById('mp-nilai').value, 10);
            if (nama && kelas && !Number.isNaN(nilai)) {
              miniProjectStudents.push({ nama, kelas, nilai: Math.max(0, Math.min(100, nilai)) });
              render();
            }
          });
        }

        container.querySelectorAll('[data-quiz-q]').forEach(btn => {
          btn.addEventListener('click', () => {
            const q = parseInt(btn.getAttribute('data-quiz-q'), 10);
            const o = parseInt(btn.getAttribute('data-quiz-o'), 10);
            quizAnswers[q] = o;
            render();
          });
        });
      }

      // Initialize selector & navigation
      const selector = document.getElementById('slide-selector');
      slides.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx);
        opt.textContent = `${idx + 1}. ${s.title}`;
        opt.className = 'bg-slate-900 text-slate-100';
        selector.appendChild(opt);
      });

      selector.addEventListener('change', (e) => {
        currentSlide = parseInt(e.target.value, 10) || 0;
        render();
      });

      document.getElementById('btn-prev').addEventListener('click', () => {
        if (currentSlide > 0) {
          currentSlide--;
          render();
        }
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        if (currentSlide < slides.length - 1) {
          currentSlide++;
          render();
        }
      });

      function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        } catch (err) {
          // Ignore if sandbox iframe restricts fullscreen
        }
      }

      document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.key === 'ArrowRight' && currentSlide < slides.length - 1) {
          currentSlide++;
          render();
        } else if (e.key === 'ArrowLeft' && currentSlide > 0) {
          currentSlide--;
          render();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        }
      });

      render();
    })();
  </script>
</body>
</html>
